"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 1000
palette = "catppuccin_mocha"

format = """
[](mauve)\
$os\
$username\
[](bg:peach fg:mauve)\
$directory\
[](fg:peach bg:yellow)\
$git_branch\
$git_status\
[](fg:yellow bg:teal)\
$nodejs$python$rust$golang$java$dotnet\
[](fg:teal bg:blue)\
$cmd_duration\
[ ](fg:blue)\
$fill$time
$character"""

[os]
disabled = false
style = "bg:mauve fg:crust"
format = "[$symbol]($style)"
[os.symbols]
Windows = "󰍲 "

[username]
show_always = true
style_user = "bg:mauve fg:crust"
style_root = "bg:red fg:crust"
format = "[$user ]($style)"

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)[$read_only]($read_only_style)"
read_only = " 󰌾"
read_only_style = "bg:peach fg:red"
truncation_length = 3
truncation_symbol = "…/"
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Desktop" = " "
"source" = " "
"repos" = " "

[git_branch]
symbol = ""
style = "bg:yellow fg:crust"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:yellow fg:crust"
format = "[($all_status$ahead_behind )]($style)"
conflicted = "≠ "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "≡ "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[nodejs]
symbol = ""
style = "bg:teal fg:crust"
format = "[ $symbol ($version) ]($style)"

[python]
symbol = ""
style = "bg:teal fg:crust"
format = "[ $symbol ($version)(\\($virtualenv\\)) ]($style)"

[rust]
symbol = ""
style = "bg:teal fg:crust"
format = "[ $symbol ($version) ]($style)"

[golang]
symbol = ""
style = "bg:teal fg:crust"
format = "[ $symbol ($version) ]($style)"

[java]
symbol = ""
style = "bg:teal fg:crust"
format = "[ $symbol ($version) ]($style)"

[dotnet]
symbol = "󰪮"
style = "bg:teal fg:crust"
format = "[ $symbol ($version) ]($style)"

[cmd_duration]
min_time = 2000
style = "bg:blue fg:crust"
format = "[ 󱦟 $duration ]($style)"

[fill]
symbol = " "

[time]
disabled = false
time_format = "%H:%M"
style = "fg:overlay1"
format = "[ $time]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
overlay1 = "#7f849c"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
